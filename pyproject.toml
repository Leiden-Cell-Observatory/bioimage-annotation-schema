[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bioimage-annotation-schema"
version = "0.1.0"
description = "Bioimage Annotation Schema: FAIR metadata for image annotations used to train AI models (LinkML, JSON Schema, Pydantic)."
readme = "README.md"
license = "CC-BY-4.0"
requires-python = ">=3.10"
dependencies = ["pydantic>=2", "pyyaml", "jsonschema"]

[project.scripts]
bas = "bioimage_annotation_schema.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bioimage_annotation_schema"]
