id: https://w3id.org/bioimage-annotation-schema
name: bioimage_annotation_schema
title: Bioimage Annotation Schema
version: 0.1.0
description: >-
  Describes sets of image annotations made for training or evaluating AI models:
  what was annotated, from which images, how, by whom, and how the annotations are
  split, plus one record per annotation. Fields that correspond to MIFA
  (bia-mifa-models, BioImage Archive) carry mappings to it, so a MIFA submission can
  be derived from a document that follows this schema.
license: CC-BY-4.0
see_also:
  - https://github.com/Leiden-Cell-Observatory/bioimage-annotation-schema
  - https://bioimage-archive.github.io/bia-mifa-models/

prefixes:
  bas: https://w3id.org/bioimage-annotation-schema/
  linkml: https://w3id.org/linkml/
  mifa: https://w3id.org/BioImage-Archive/bia-mifa-models/
  schema: http://schema.org/
  pav: http://purl.org/pav/
  prov: http://www.w3.org/ns/prov#
default_prefix: bas
default_range: string

imports:
  - linkml:types

classes:

  AnnotationSet:
    tree_root: true
    description: >-
      A set of image annotations for AI: one document per set. The annotations
      themselves are AnnotationRecords, usually kept as a CSV table next to it.
    class_uri: schema:Dataset
    close_mappings:
      - mifa:Annotations
    attributes:
      schema_version:
        description: Version of this schema the document follows (semantic versioning).
        required: true
        pattern: "^0\\.1\\.[0-9]+$"
      name:
        description: Short name of the set.
        required: true
        slot_uri: schema:name
      description:
        description: What the set contains and what it is for, in a few sentences.
        slot_uri: schema:description
      created:
        description: When the set was created.
        required: true
        range: datetime
        slot_uri: schema:dateCreated
      license:
        description: >-
          License of the annotations. Only the two licences the BioImage Archive
          accepts are allowed.
        required: true
        range: License
        slot_uri: schema:license
        exact_mappings:
          - mifa:license
      version:
        description: Version of this set, e.g. "1" or "1.1".
        exact_mappings:
          - mifa:version
      changes:
        description: What changed since the previous version.
        exact_mappings:
          - mifa:changes
      previous_version:
        description: Identifier (DOI or URL) of the previous version of the set.
        range: uriorcurie
        exact_mappings:
          - mifa:previous_version
      ai_models_trained:
        description: AI models trained on these annotations, by DOI or URL (e.g. a BioImage Model Zoo entry).
        range: uriorcurie
        multivalued: true
        exact_mappings:
          - mifa:ai_models_trained
      authors:
        description: Authors of the set, in citation order.
        range: Person
        multivalued: true
        inlined_as_list: true
        slot_uri: schema:author
        exact_mappings:
          - mifa:author
      keywords:
        description: Keywords or tags that describe the set.
        multivalued: true
        slot_uri: schema:keywords
        exact_mappings:
          - mifa:keywords
      links:
        description: Web pages about the set or its data, e.g. a repository or a project page.
        range: Link
        multivalued: true
        inlined_as_list: true
      study:
        description: The biological and experimental context of the images.
        range: Study
        inlined: true
      source_dataset:
        description: The image dataset the annotated images come from.
        range: SourceDataset
        inlined: true
      methodology:
        description: How the annotations were made.
        range: Methodology
        required: true
        inlined: true
      classes:
        description: The annotation classes (e.g. nucleus, cell, background).
        range: AnnotationClass
        multivalued: true
        inlined_as_list: true
      sampling:
        description: Which channels, planes and regions of the images were annotated.
        range: Sampling
        inlined: true
      split:
        description: How the annotations were divided over training, validation and test.
        range: Split
        inlined: true
      normalization:
        description: Intensity normalisation intended for model input.
        range: Normalization
        inlined: true
      content_codes:
        description: >-
          How the ISCC codes in the records were made. Required when any record has
          input_iscc, mask_iscc or image_iscc: codes are only comparable when they
          were made the same way.
        range: ContentCodes
        inlined: true
      sessions:
        description: Annotation sessions, oldest first. Records refer to them by id.
        range: Session
        multivalued: true
        inlined_as_list: true
      notes:
        description: Free text - context, caveats, known issues.
      extensions:
        description: >-
          Tool- or project-specific metadata this schema does not cover, under a
          namespace key such as the tool name.
        range: Any

  Any:
    class_uri: linkml:Any
    description: Any value.

  Person:
    description: "A person: an author of the set or an annotator."
    class_uri: schema:Person
    exact_mappings:
      - mifa:Author
    attributes:
      first_name:
        description: Given name.
        required: true
        slot_uri: schema:givenName
        exact_mappings:
          - mifa:author_first_name
      last_name:
        description: Family name, with particles such as "van der".
        required: true
        slot_uri: schema:familyName
        exact_mappings:
          - mifa:author_last_name
      orcid:
        description: ORCID iD as URL.
        pattern: "^https://orcid\\.org/[0-9]{4}-[0-9]{4}-[0-9]{4}-[0-9]{3}[0-9X]$"
        exact_mappings:
          - mifa:orcid_id
      email:
        description: Email address.
        slot_uri: schema:email
        exact_mappings:
          - mifa:email
      affiliations:
        description: Organisations the person is affiliated with.
        range: Organisation
        multivalued: true
        inlined_as_list: true
        slot_uri: schema:affiliation
        exact_mappings:
          - mifa:organisation
      roles:
        description: Roles in the work, e.g. annotator, data curator.
        multivalued: true
        exact_mappings:
          - mifa:role

  Organisation:
    description: An organisation a person is affiliated with.
    class_uri: schema:Organization
    exact_mappings:
      - mifa:OrganisationInfo
    attributes:
      name:
        description: Name of the organisation.
        required: true
        slot_uri: schema:name
        exact_mappings:
          - mifa:organisation_name
      ror:
        description: ROR identifier as URL, e.g. https://ror.org/027bh9e22.
        pattern: "^https://ror\\.org/[0-9a-z]{9}$"
        exact_mappings:
          - mifa:ror_id
      address:
        description: Postal address of the organisation.
        exact_mappings:
          - mifa:address

  Link:
    description: A web page about the set or its data.
    attributes:
      url:
        description: URL of the page.
        range: uri
        required: true
        slot_uri: schema:url
        exact_mappings:
          - mifa:link_url
      description:
        description: What the linked page contains.
        exact_mappings:
          - mifa:link_description

  Publication:
    description: A publication associated with the study.
    class_uri: schema:ScholarlyArticle
    exact_mappings:
      - mifa:Publications
    attributes:
      title:
        description: Title of the publication.
        required: true
        exact_mappings:
          - mifa:publication_title
      authors:
        description: Author list as written in the reference.
        required: true
        exact_mappings:
          - mifa:publication_authors
      doi:
        description: DOI as URL, e.g. https://doi.org/10.1038/s41592-019-0612-7.
        range: uriorcurie
        exact_mappings:
          - mifa:publication_doi
      year:
        description: Year of publication.
        range: integer
        exact_mappings:
          - mifa:publication_year
      pubmed_id:
        description: PubMed identifier.
        range: uriorcurie
        exact_mappings:
          - mifa:pubmed_id

  Grant:
    description: A grant that funded the study.
    exact_mappings:
      - mifa:GrantReference
    attributes:
      id:
        description: Identifier of the grant.
        required: true
        exact_mappings:
          - mifa:grant_id
      funder:
        description: Name of the funding body.
        required: true
        exact_mappings:
          - mifa:funder

  Study:
    description: Biological and experimental context of the images.
    close_mappings:
      - mifa:Study
    attributes:
      title:
        description: Title of the study; often the title of the associated publication.
        required: true
        exact_mappings:
          - mifa:title
      description:
        description: Brief description of the study, including the biological application of the images.
        exact_mappings:
          - mifa:description
      organism:
        description: Organism the samples come from, e.g. Homo sapiens.
      organism_term:
        description: >-
          IRI of an NCBI Taxonomy term for the organism, e.g.
          http://purl.obolibrary.org/obo/NCBITaxon_9606.
        range: uri
      imaging_method:
        description: Imaging method, e.g. confocal fluorescence microscopy.
      imaging_method_term:
        description: >-
          IRI of an FBbi term for the imaging method, e.g.
          http://purl.obolibrary.org/obo/FBbi_00100013.
        range: uri
      funding_statement:
        description: How the study was funded, in words.
        exact_mappings:
          - mifa:funding_statement
      publications:
        description: Publications associated with the study.
        range: Publication
        multivalued: true
        inlined_as_list: true
        exact_mappings:
          - mifa:publications
      grants:
        description: Grants that funded the study.
        range: Grant
        multivalued: true
        inlined_as_list: true
        exact_mappings:
          - mifa:grants
      acknowledgements:
        description: People or groups to acknowledge.
        exact_mappings:
          - mifa:acknowledgements

  SourceDataset:
    description: The image dataset the annotated images come from.
    attributes:
      description:
        description: What the source images are, in words.
        required: true
      identifier:
        description: Accession or DOI, e.g. S-BIAD123 or idr0001.
        slot_uri: schema:identifier
      url:
        description: Web page or download address of the dataset.
        range: uri
        slot_uri: schema:url
      license:
        description: License of the source images, e.g. CC-BY-4.0.
        slot_uri: schema:license

  Methodology:
    description: How the annotations were made.
    attributes:
      overview:
        description: Short summary of the type of annotation and how it was made.
        exact_mappings:
          - mifa:annotation_overview
      annotation_types:
        description: "Kinds of annotation in the set, using MIFA's values."
        range: AnnotationType
        required: true
        multivalued: true
        exact_mappings:
          - mifa:annotation_type
      mask_kind:
        description: For segmentation masks - one value per object (instance) or per class (semantic).
        range: MaskKind
      method:
        description: Whether annotations were drawn by hand, proposed by software and corrected, or made by software alone.
        range: AnnotationMethod
      method_description:
        description: >-
          How the annotations were created, in words: who, which software,
          consensus and quality checks.
        exact_mappings:
          - mifa:annotation_method
      criteria:
        description: What counts as an object and where its boundary is, in words.
        required: true
        exact_mappings:
          - mifa:annotation_criteria
      coverage:
        description: >-
          Within an annotated region, whether all objects are annotated, a
          representative selection, or only some.
        range: Coverage
      coverage_description:
        description: Which images were annotated and what share of the dataset, in words.
        exact_mappings:
          - mifa:annotation_coverage
      annotators:
        description: People who made or reviewed the annotations, if different from the set's authors.
        range: Person
        multivalued: true
        inlined_as_list: true
        exact_mappings:
          - mifa:authors
      confidence_level:
        description: Confidence in the annotations' accuracy, e.g. annotator experience or inter-annotator agreement.
        exact_mappings:
          - mifa:annotation_confidence_level
      tools:
        description: Software used to make the annotations.
        range: Tool
        multivalued: true
        inlined_as_list: true

  Tool:
    description: Software used to make the annotations.
    class_uri: schema:SoftwareApplication
    attributes:
      name:
        description: Name of the software, e.g. micro-sam or cellpose.
        required: true
        slot_uri: schema:name
      version:
        description: Version of the software.
        slot_uri: schema:softwareVersion
      mode:
        description: How the software was used.
        range: ToolMode
      model:
        description: The AI model the software used, if any.
        range: Model
        inlined: true
      parameters:
        description: Settings the software ran with, as the tool names them.
        range: Any

  Model:
    description: An AI model that proposed annotations.
    attributes:
      name:
        description: Name of the model, e.g. vit_b_lm.
        required: true
      version:
        description: Version of the model.
      url:
        description: Where the model can be found, e.g. a BioImage Model Zoo page.
        range: uri
      doi:
        description: DOI of the model.

  AnnotationClass:
    description: One annotation class.
    attributes:
      name:
        description: Name of the class, e.g. nucleus.
        required: true
      description:
        description: What belongs to the class, in words.
      label_value:
        description: >-
          Pixel value of the class in semantic masks. Not used for instance masks,
          where each object has its own value.
        range: integer
        minimum_value: 0
      ontology_term:
        description: IRI of an ontology term for the class, e.g. a CL or GO term.
        range: uri
      color:
        description: "Display colour as hex, e.g. #E4685D."
        pattern: "^#[0-9A-Fa-f]{6}$"

  PlaneSelection:
    description: Which timepoints or z-slices were annotated.
    attributes:
      mode:
        description: How the planes were chosen.
        range: SelectionMode
        required: true
      values:
        description: The indices, for mode 'specific'.
        range: integer
        multivalued: true
      n:
        description: How many were drawn, for mode 'random'.
        range: integer
        minimum_value: 1

  Sampling:
    description: Which parts of the images were annotated. Per-annotation detail is in the records.
    attributes:
      label_channel:
        description: Channel the annotations were drawn on.
        range: integer
        minimum_value: 0
      input_channels:
        description: >-
          Channels meant as model input; may differ from label_channel (annotate on
          a nuclear stain, train on brightfield).
        range: integer
        multivalued: true
      timepoints:
        description: Which timepoints were annotated.
        range: PlaneSelection
        inlined: true
      z_slices:
        description: Which z-slices were annotated.
        range: PlaneSelection
        inlined: true
      volumetric:
        description: True if annotations are 3D volumes rather than 2D planes.
        range: boolean
      patches:
        description: Patch size and number, if annotations cover patches.
        range: Patches
        inlined: true

  Patches:
    description: Present if annotations cover patches rather than whole planes.
    attributes:
      width:
        description: Patch width in pixels.
        range: integer
        required: true
        minimum_value: 1
      height:
        description: Patch height in pixels.
        range: integer
        required: true
        minimum_value: 1
      per_image:
        description: Number of patches per image plane.
        range: integer
        minimum_value: 1
      random:
        description: True if patch positions were drawn at random, false if they tile the plane.
        range: boolean

  Split:
    description: How annotations were divided over training, validation and test.
    attributes:
      strategy:
        description: How the split was decided.
        range: SplitStrategy
      unit:
        description: >-
          Level at which data are assigned to a split; all annotations of one unit
          share a split. 'image' or 'well', or another level named by the tool.
      rationale:
        description: Why this unit, e.g. 'fields within a well do not overlap'.
      stratify_by:
        description: Metadata keys the split was balanced on (e.g. cell_line, treatment).
        multivalued: true
      seed:
        description: Seed of the random choices, to reproduce the selection with the same tool.
        range: integer
        minimum_value: 0

  Normalization:
    description: Intensity normalisation intended for model input.
    attributes:
      method:
        description: Normalisation method.
        range: NormalizationMethod
        required: true
      percentile_low:
        description: Lower percentile, mapped to 0.
        range: float
        minimum_value: 0
        maximum_value: 100
      percentile_high:
        description: Upper percentile, mapped to 1.
        range: float
        minimum_value: 0
        maximum_value: 100
      clip:
        description: "True if values outside [0, 1] are clipped."
        range: boolean

  Session:
    description: One annotation session - who, when, with what, and a note.
    class_uri: prov:Activity
    attributes:
      id:
        description: Number of the session within the set, from 0.
        range: integer
        required: true
        minimum_value: 0
      kind:
        description: "'annotate' creates annotations, 'review' checks or corrects them."
        range: SessionKind
        required: true
      started:
        description: When the session started.
        range: datetime
        required: true
        slot_uri: prov:startedAtTime
      ended:
        description: When the session ended; absent while it is open.
        range: datetime
        slot_uri: prov:endedAtTime
      status:
        description: State of the session.
        range: SessionStatus
      annotator:
        description: Who annotated - a name, ORCID or pseudonym.
      software:
        description: Software and version, e.g. 'omero-annotate-ai 0.5.0'.
      model:
        description: Name of the AI model used in the session, if any.
      n_annotated:
        description: Number of annotations saved in the session.
        range: integer
        minimum_value: 0
      note:
        description: Free-text note by the annotator.

  ContentCodes:
    description: >-
      How the ISCC codes (ISO 24138) in the records were made. ISCC is a family of
      codes: the same image gives different codes depending on the code type, which
      pixels are coded and how they are prepared, so each kind is declared here.
    attributes:
      region:
        description: How input_iscc and mask_iscc were made.
        range: CodeMethod
        inlined: true
      image:
        description: How image_iscc (the code of the whole source image) was made.
        range: CodeMethod
        inlined: true

  CodeMethod:
    description: How one kind of ISCC code was computed.
    attributes:
      code_type:
        description: The ISCC code type.
        range: IsccCodeType
        required: true
      bits:
        description: >-
          Length of the code's body in bits, e.g. 64 for an Image-Code unit, 128 or
          256 (wide) for an ISCC-SUM.
        range: integer
        minimum_value: 1
      pixels:
        description: >-
          Which pixels were coded, e.g. 'the annotated region as saved in
          input_file' or 'all planes of the source image'.
        required: true
      preparation:
        description: >-
          What was done to the pixels before coding: plane order and byte encoding,
          projection, resizing, intensity scaling, mask binarisation. 'none' if the
          stored pixels were coded as they are.
        required: true
      specification:
        description: >-
          The specification the preparation follows, if any, e.g.
          https://ieps.iscc.codes/iep-0018/ (IMAGEWALK) for bioimage ISCC-SUMs.
        range: uri
      implementation:
        description: Software and version that computed the codes, e.g. 'omero-annotate-ai 0.6.0 (iscc-lib 0.7.1)'.
        required: true

  AnnotationRecord:
    description: >-
      One annotation of a set: the image region it covers, its split, its state and
      its files. Flat, so a table of records is a CSV file with one column per
      field (well_metadata and external_ids as JSON text).
    close_mappings:
      - mifa:FileLevelMetadata
    attributes:
      annotation_id:
        description: Identifier of the annotation, unique within the set. Files are named after it.
        identifier: true
        required: true
        slot_uri: schema:identifier
        exact_mappings:
          - mifa:annotation_id
      image_uri:
        description: >-
          The source image - omero:image:<id>, an http(s) URL of an OME-Zarr image,
          or another resolvable URI.
        required: true
        exact_mappings:
          - mifa:source_image_id
      image_name:
        description: Name of the source image, for people.
      level:
        description: Multiscale level the coordinates refer to (0 = full resolution).
        range: integer
        minimum_value: 0
      well:
        description: Plate well, e.g. B2.
      field:
        description: Field (well sample) within the well.
      well_metadata:
        description: Key-value metadata of the well as a JSON object, e.g. {"cell_line":"U2OS"}.
      channel:
        description: Channel annotated, from 0.
        range: integer
        minimum_value: 0
      timepoint:
        description: Timepoint annotated, from 0.
        range: integer
        minimum_value: 0
      z_slice:
        description: Z-slice of a 2D annotation.
        range: integer
        minimum_value: 0
      z_start:
        description: First z-slice of a volumetric annotation.
        range: integer
        minimum_value: 0
      z_end:
        description: Last z-slice of a volumetric annotation (inclusive).
        range: integer
        minimum_value: 0
      patch_x:
        description: Left edge of the patch in pixels, at the given level.
        range: integer
        minimum_value: 0
      patch_y:
        description: Top edge of the patch in pixels, at the given level.
        range: integer
        minimum_value: 0
      patch_width:
        description: Width of the patch in pixels.
        range: integer
        minimum_value: 1
      patch_height:
        description: Height of the patch in pixels.
        range: integer
        minimum_value: 1
      split:
        description: Split the annotation belongs to.
        range: SplitName
        required: true
      status:
        description: State of the annotation.
        range: RecordStatus
        required: true
      annotation_type:
        description: "Kind of annotation, using MIFA's values."
        range: AnnotationType
        exact_mappings:
          - mifa:annotation_type
      created_at:
        description: When the annotation was created.
        range: datetime
        slot_uri: pav:authoredOn
        exact_mappings:
          - mifa:annotation_creation_time
      updated_at:
        description: When the annotation was last changed.
        range: datetime
        slot_uri: pav:lastUpdateOn
      session:
        description: id of the session (in the set) that last saved this annotation.
        range: integer
        minimum_value: 0
      input_file:
        description: Path of the annotated image region, relative to the set's folder.
      mask_file:
        description: Path of the mask, relative to the set's folder.
      input_digest:
        description: Pixel SHA-256 of the annotated image region.
        range: PixelDigest
      mask_digest:
        description: Pixel SHA-256 of the mask.
        range: PixelDigest
      input_iscc:
        description: >-
          ISCC code of the annotated image region, made as declared in the set's
          content_codes.region.
        range: IsccCode
      mask_iscc:
        description: ISCC code of the mask, made as declared in the set's content_codes.region.
        range: IsccCode
      image_iscc:
        description: >-
          ISCC code of the whole source image, made as declared in the set's
          content_codes.image - for example the ISCC-SUM (IMAGEWALK) that
          omero-iscc stores on OMERO images. Identifies the source by content,
          whatever its URI.
        range: IsccCode
      transformations:
        description: Transformations needed to align the annotation with the source image, e.g. a rotation or crop.
        exact_mappings:
          - mifa:transformations
      external_ids:
        description: >-
          Identifiers of copies in other systems as a JSON object, e.g.
          {"omero_roi":"123","omero_label_image":"456"}.
    rules:
      - description: An excluded annotation has no mask.
        preconditions:
          slot_conditions:
            status:
              equals_string: excluded
        postconditions:
          slot_conditions:
            mask_file:
              value_presence: ABSENT
      - description: A patch needs all four of x, y, width and height.
        preconditions:
          slot_conditions:
            patch_x:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            patch_y:
              value_presence: PRESENT
            patch_width:
              value_presence: PRESENT
            patch_height:
              value_presence: PRESENT
      - description: A volumetric annotation needs z_start and z_end.
        preconditions:
          slot_conditions:
            z_start:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            z_end:
              value_presence: PRESENT

types:

  PixelDigest:
    typeof: string
    description: >-
      Pixel SHA-256 - lowercase hex SHA-256 of the UTF-8 text '<dtype>|<shape>|'
      followed by the pixel values in C order, little-endian. <dtype> is the NumPy
      dtype string with '<' byte order (e.g. '<u2', '|u1'), <shape> the Python tuple
      text (e.g. '(512, 512)'). Independent of file format and compression. An
      exact-match check of the saved files; not the IMAGEWALK canonical bytes
      (IEP-0018: big-endian, no dtype and shape prefix), so it does not equal a
      SHA-256 another bioimage tool computes over IMAGEWALK.
    pattern: "^[0-9a-f]{64}$"

  IsccCode:
    typeof: string
    description: >-
      An ISCC code (ISO 24138) in its canonical text form. Which code type and how
      it was made is declared in the set's content_codes.
    pattern: "^ISCC:[A-Z2-7]+$"

enums:

  License:
    description: Licenses the BioImage Archive accepts for annotations.
    permissible_values:
      CC-BY-4.0:
        description: "Creative Commons Attribution 4.0: reuse with credit."
        meaning: mifa:CC_BY
      CC0-1.0:
        description: "Creative Commons Zero: no rights reserved."
        meaning: mifa:CC0

  AnnotationType:
    description: Same values as MIFA's AnnotationType.
    enum_uri: mifa:AnnotationType
    permissible_values:
      class_labels:
        description: Tags that identify features, patterns or classes in images.
        meaning: mifa:class_labels
      bounding_boxes:
        description: Rectangles completely enclosing a structure of interest.
        meaning: mifa:bounding_boxes
      counts:
        description: Number of objects, such as cells, in an image.
        meaning: mifa:counts
      derived_annotations:
        description: Values derived from the images, e.g. point spread function, signal-to-noise ratio or focus.
        meaning: mifa:derived_annotations
      geometrical_annotations:
        description: "Polygons and shapes outlining a region of interest: primitives, 2D polygons, 3D meshes."
        meaning: mifa:geometrical_annotations
      graphs:
        description: Graphs of the morphology, connectivity or spatial arrangement of structures, e.g. skeletons.
        meaning: mifa:graphs
      point_annotations:
        description: Coordinates of points of interest, e.g. object centroids or landmarks.
        meaning: mifa:point_annotations
      segmentation_mask:
        description: An image of the same size as the source, each pixel value marking an object, class or background.
        meaning: mifa:segmentation_mask
      tracks:
        description: Movement or trajectories of objects through a sequence of images.
        meaning: mifa:tracks
      weak_annotations:
        description: Rough, imprecise annotations that are fast to make, e.g. a scribble per object.
        meaning: mifa:weak_annotations
      other:
        description: Another kind; describe it in the methodology overview.
        meaning: mifa:other

  IsccCodeType:
    description: ISCC code types used for images.
    permissible_values:
      image_code:
        description: >-
          ISCC-UNIT Image-Code - a perceptual code of a small grayscale image; codes
          of similar images differ in few bits, so it finds near-duplicates.
      iscc_sum:
        description: >-
          ISCC-SUM - Data-Code plus Instance-Code over a byte stream (for bioimages,
          the IMAGEWALK canonical bytes); the Instance-Code part matches only
          identical content.
      iscc_code:
        description: A composite ISCC-CODE of several units.

  MaskKind:
    description: How pixel values in a segmentation mask are assigned.
    permissible_values:
      instance:
        description: Each object has its own pixel value.
      semantic:
        description: Each class has its own pixel value (see AnnotationClass.label_value).

  AnnotationMethod:
    description: How much of the annotation was done by people and how much by software.
    permissible_values:
      manual:
        description: Drawn by hand.
      semi_automatic:
        description: Proposed by software and checked or corrected by a person.
      automatic:
        description: Made by software without correction.

  Coverage:
    description: How completely the objects in an annotated region are annotated.
    permissible_values:
      all:
        description: Every object in the region is annotated.
      representative:
        description: A representative selection of the objects is annotated.
      partial:
        description: Only some objects are annotated, without claim of representativeness.

  ToolMode:
    description: How a tool was used.
    permissible_values:
      automatic:
        description: The tool annotated on its own.
      interactive:
        description: "A person annotated with the tool's help, e.g. prompts to a segmentation model."
      human_in_the_loop:
        description: "The tool's model was retrained on corrected annotations during the work."

  SelectionMode:
    description: How timepoints or z-slices were chosen.
    permissible_values:
      all:
        description: All of them.
      random:
        description: A random draw of n.
      specific:
        description: The indices listed in values.

  SplitStrategy:
    description: How annotations were assigned to splits.
    permissible_values:
      random_split:
        description: At random, by unit.
      expert_review:
        description: Chosen by a person.
      cross_validation:
        description: Rotating folds; the split recorded is one fold.

  NormalizationMethod:
    description: Intensity normalisation methods.
    permissible_values:
      percentile:
        description: Per-image percentile bounds mapped to [0, 1].
      none:
        description: Raw intensities.

  SessionKind:
    description: What a session did.
    permissible_values:
      annotate:
        description: Created annotations.
      review:
        description: Checked or corrected existing annotations.

  SessionStatus:
    description: State of a session.
    permissible_values:
      open:
        description: In progress.
      finished:
        description: Ended normally.
      interrupted:
        description: Ended without finishing, e.g. a crash or a closed window.

  SplitName:
    description: The splits of a set.
    permissible_values:
      training:
        description: Used to train models.
      validation:
        description: Used to tune and select models during training.
      test:
        description: Held out to evaluate the final model.

  RecordStatus:
    description: State of an annotation record.
    permissible_values:
      pending:
        description: Not yet annotated.
      annotated:
        description: Annotation saved.
      excluded:
        description: Looked at and left out (e.g. out of focus); no mask, not used for training.
