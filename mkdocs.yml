site_name: Bioimage Annotation Schema
site_description: A metadata schema for sets of image annotations made for AI, mapped to MIFA.
repo_url: https://github.com/Leiden-Cell-Observatory/bioimage-annotation-schema
repo_name: bioimage-annotation-schema
edit_uri: ""

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle: { icon: material/brightness-7, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle: { icon: material/brightness-4, name: Light mode }
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy

extra_css: [assets/model-browser.css]
extra_javascript: [assets/model-browser.js]

markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

exclude_docs: |
  build.py

nav:
  - Home: index.md
  - Overview: overview.md
  - Model browser: model.md
  - MIFA crosswalk: mifa.md
  - Reference: reference/index.md

not_in_nav: |
  /reference/
