[workspace]
name = "bioimage-annotation-schema"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

[dependencies]
python = "3.12.*"
linkml = ">=1.9"
pydantic = ">=2"
pytest = "*"
pyyaml = "*"
jsonschema = "*"
hatchling = "*"
marimo = "*"
polars = "*"

[tasks]
gen-json-set = "gen-json-schema --top-class AnnotationSet --indent 2 src/bioimage_annotation_schema/schema/bioimage_annotation_schema.yaml > src/bioimage_annotation_schema/schema/0.1/annotation-set.schema.json"
gen-json-record = "gen-json-schema --top-class AnnotationRecord --indent 2 src/bioimage_annotation_schema/schema/bioimage_annotation_schema.yaml > src/bioimage_annotation_schema/schema/0.1/annotation-record.schema.json"
gen-pydantic = "gen-pydantic src/bioimage_annotation_schema/schema/bioimage_annotation_schema.yaml > src/bioimage_annotation_schema/datamodel.py"
gen = { depends-on = ["gen-json-set", "gen-json-record", "gen-pydantic"] }
test = "pytest tests -v"
tour = "marimo edit notebooks/tour.py"

[pypi-dependencies]
bia-mifa-models = { git = "https://github.com/BioImage-Archive/bia-mifa-models.git", tag = "v1.1.5" }
bioimage-annotation-schema = { path = ".", editable = true }

[feature.docs.dependencies]
mkdocs-material = "*"

[feature.docs.tasks]
docs-gen = "python docs/build.py"
docs-serve = { cmd = "mkdocs serve", depends-on = ["docs-gen"] }
docs-build = { cmd = "mkdocs build --strict", depends-on = ["docs-gen"] }

[environments]
docs = ["docs"]
