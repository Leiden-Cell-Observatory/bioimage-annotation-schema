name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          locked: true
      - name: Generated files are up to date
        run: |
          pixi run gen
          git diff --exit-code src/bioimage_annotation_schema
      - run: pixi run test
